[package]
name = "axum-kickoff"
authors = ["Luiz Otavio V. B. Oliveira <luiz.vbo@gmail.com>"]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/luizvbo/axum-kickoff"
license = "MIT OR Apache-2.0"

[features]
default = []
metrics = ["dep:prometheus"]
jemalloc = ["dep:tikv-jemallocator"]

[[bin]]
name = "axum-kickoff"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie-signed", "erased-json"] }
cookie = { version = "0.18", features = ["secure"] }
base64 = "0.23"
parking_lot = "0.12"
prometheus = { version = "0.14", optional = true }
derive_more = { version = "2", features = ["deref"] }
dotenvy = "0.15"
http = "1"
num_cpus = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tikv-jemallocator = { version = "0.7", optional = true }
jiff = { version = "0.2", features = ["serde"] }
toasty = { version = "0.9", features = ["sqlite", "jiff"] }
toasty-cli = "0.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "compression-gzip",
  "timeout",
  "catch-panic",
  "fs",
  "normalize-path",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
askama = "0.16"
oauth2 = "5"
reqwest = { version = "0.13", features = ["json"] }
secrecy = "0.10"
rand = "0.10"
sha2 = "0.11"
aes-gcm = "0.11"
hex = "0.4"
bytes = "1"
urlencoding = "2"
subtle = "2"
ipnet = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"

[dev-dependencies]
insta = { version = "1.48", features = ["json"] }
tempfile = "3"
