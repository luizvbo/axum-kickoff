[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# RUSTSEC-2025-0134: rustls-pemfile is unmaintained (repo archived Aug 2025),
# not vulnerable — 2.2.0 is a thin wrapper over rustls-pki-types, already in
# the tree. Reached only via toasty-driver-postgresql through the pinned
# toasty =0.11.0 (latest release); drop this once toasty migrates to
# rustls-pki-types' PemObject.
#
# RUSTSEC-2026-0374: basic-toml is unmaintained, not vulnerable — it parses
# askama.toml at compile time inside askama_derive. Even askama 0.16.1 still
# depends on it, so no upgrade path exists; drop this once askama moves off it.
ignore = [
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
