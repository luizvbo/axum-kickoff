{% extends "base.html" %}

{% block title %}{{ status }} - Error{% endblock %}

{% block content %}
<main class="container error-page" id="main-content">
    <h1 class="error-status">{{ status }}</h1>
    <p class="error-message">{{ message }}</p>
    <p class="error-back">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </p>
</main>
{% endblock %}
