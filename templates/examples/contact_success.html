<!-- Partial template: Contact form success message -->
<!-- This is returned as HTML fragment when form submission succeeds -->

<div class="alert alert-success" role="status" x-data>
    <div class="alert-icon">✓</div>
    <div class="alert-content">
        <h4>Message Sent!</h4>
        <p>Thank you, {{ name }}. We've received your message and will get back to you at {{ email }}.</p>
        <!-- Alpine (CSP build) handles dismissal: no inline script needed.
             Alpine's MutationObserver also initializes this when HTMX swaps
             the fragment in. -->
        <button class="btn btn-secondary-solid alert-clear-btn" @click="$root.remove()">
            Clear
        </button>
    </div>
</div>
