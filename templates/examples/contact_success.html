<!-- Partial template: Contact form success message -->
<!-- This is returned as HTML fragment when form submission succeeds -->

<div class="alert alert-success" role="status">
    <div class="alert-icon">✓</div>
    <div class="alert-content">
        <h4>Message Sent!</h4>
        <p>Thank you, {{ name }}. We've received your message and will get back to you at {{ email }}.</p>
        <button class="btn btn-secondary alert-clear-btn">
            Clear
        </button>
    </div>
</div>
<script nonce="{{ ctx.csp_nonce }}">
    (function() {
        document.querySelectorAll('.alert-clear-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var alert = btn.closest('.alert');
                if (alert) alert.remove();
            });
        });
    })();
</script>
