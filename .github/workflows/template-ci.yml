name: Template CI

# CI for the axum-kickoff *template repository*. The source checkout does not
# compile (it contains Liquid placeholders), so this workflow renders the
# template with cargo-generate into $RUNNER_TEMP — outside the checkout dir,
# where cargo behaves normally — and runs the real CI suite on the rendered
# output. This file is `ignore`d by cargo-generate and never ships in
# generated projects; those get `.github/workflows/ci.yml` instead.
on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions: {}

concurrency:
  group: template-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-generate versioning=semver
  CARGO_GENERATE_VERSION: 0.25.0
  # renovate: datasource=crate depName=cargo-deny versioning=semver
  CARGO_DENY_VERSION: 0.19.8
  # renovate: datasource=crate depName=cargo-machete versioning=semver
  CARGO_MACHETE_VERSION: 0.9.2
  # renovate: datasource=crate depName=cargo-audit versioning=semver
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  render:
    name: Render + verify (${{ matrix.name }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            project: smoke-default
            defines: ''
          - name: postgresql-sentry-metrics-jemalloc
            project: smoke-full
            defines: >-
              -d database=postgresql
              -d metrics=true
              -d sentry=true
              -d jemalloc=true

    env:
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-generate@${{ env.CARGO_GENERATE_VERSION }}

      # Renders to $RUNNER_TEMP/render/<project>, outside the checkout —
      # cargo fails on generated code left inside the template checkout
      # (rust-lang/cargo#9922).
      - name: Render template
        run: |
          mkdir -p "${RUNNER_TEMP}/render"
          cargo generate --path . \
            --name "${{ matrix.project }}" \
            --destination "${RUNNER_TEMP}/render" \
            --vcs none --silent ${{ matrix.defines }}

      - name: Check
        run: cargo check
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      - name: Fmt
        run: cargo fmt --check --all
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      # SQLite stays compiled in for every render, so the in-memory test
      # suite runs without services on both legs.
      - name: Test
        run: cargo test
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      - name: Doc
        run: cargo doc --no-deps --document-private-items
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      - name: No stale template names
        run: |
          if grep -rnE 'axum[-_.]kickoff|axum_kickoff' . \
              --exclude-dir=target --exclude-dir=.git \
              | grep -v 'github.com/luizvbo/axum-kickoff'; then
            echo "::error::stale axum-kickoff references in rendered output"
            exit 1
          fi
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

      - name: Askama syntax survived verbatim
        run: |
          grep -q '{{ ctx.csrf_token }}' templates/base.html
          grep -q '{{ ctx.app_name }}' templates/index.html
          grep -q '{% block title %}' templates/index.html
        working-directory: ${{ runner.temp }}/render/${{ matrix.project }}

  deps:
    name: Dependencies (rendered)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: >-
            cargo-generate@${{ env.CARGO_GENERATE_VERSION }},
            cargo-deny@${{ env.CARGO_DENY_VERSION }},
            cargo-machete@${{ env.CARGO_MACHETE_VERSION }},
            cargo-audit@${{ env.CARGO_AUDIT_VERSION }},
            zizmor

      # cargo-deny/machete/audit need a parseable manifest — they run against
      # the rendered default project, not the Liquid-annotated checkout.
      - name: Render default project
        run: |
          mkdir -p "${RUNNER_TEMP}/render"
          cargo generate --path . \
            --name smoke-deps \
            --destination "${RUNNER_TEMP}/render" \
            --vcs none --silent

      - run: cargo deny check
        working-directory: ${{ runner.temp }}/render/smoke-deps

      - run: cargo machete
        working-directory: ${{ runner.temp }}/render/smoke-deps

      - run: cargo audit --db "$(mktemp -d -p "${RUNNER_TEMP}" cargo-audit-db-XXXXXX)"
        working-directory: ${{ runner.temp }}/render/smoke-deps

      # zizmor lints the template repo's own workflows (both files).
      - run: zizmor .github/workflows
