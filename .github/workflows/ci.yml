name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-deny versioning=semver
  CARGO_DENY_VERSION: 0.19.8
  # renovate: datasource=crate depName=cargo-machete versioning=semver
  CARGO_MACHETE_VERSION: 0.9.2
  # renovate: datasource=crate depName=cargo-audit versioning=semver
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    env:
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --document-private-items

  deps:
    name: Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-machete@${{ env.CARGO_MACHETE_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }},zizmor

      - run: cargo deny check

      - run: cargo machete

      - run: cargo audit --db "$(mktemp -d -p "${RUNNER_TEMP}" cargo-audit-db-XXXXXX)"

      - run: zizmor .github/workflows

  test:
    name: Test
    runs-on: ubuntu-24.04

    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
      RUSTFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      - run: cargo insta test --all-features
