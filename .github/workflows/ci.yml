name: CI

# Inert stub, template repository only. The real generated-project CI lives
# in `.github/ci.yml`; the cargo-generate post-hook (`post.rhai`) deletes
# this file and moves that one into place at render time. It triggers only
# on manual dispatch so it never runs in the template repository — where
# the checkout cannot compile (Liquid placeholders).
on:
  workflow_dispatch:

permissions: {}

jobs:
  stub:
    name: Replaced at render time
    runs-on: ubuntu-24.04
    steps:
      - run: echo "This stub is replaced by .github/ci.yml during cargo-generate rendering."
