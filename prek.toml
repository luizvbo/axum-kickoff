# Pre-commit hooks for {{project-name}}
# Install prek: cargo install prek
# Run: prek install
# Skip: SKIP=cargo-fmt git commit ...
#
# Template-repo note: this file ships to generated projects. In the template
# checkout itself, `cargo-generate.toml` exists and `Cargo.toml` contains
# Liquid placeholders, so tools that need a parseable manifest can't run
# directly. fmt/deny/machete call scripts/rendered-check.sh, which renders a
# default project and runs there (like template-ci.yml's deps job); clippy/doc
# need a full build, so they no-op on the marker file instead — same
# convention as .github/workflows/ci.yml, and template-ci covers them.

fail_fast = false

# Priority 0: Read-only hooks and file type-specific fixers
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  # Cargo.toml is not valid TOML in the template checkout (Liquid); cargo
  # itself validates the rendered manifest in generated projects.
  { id = "check-toml", exclude = "Cargo.toml" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
]

# Spell checking
# `--isolated` stops typos from parsing Cargo.toml looking for config — in the
# template checkout that file isn't valid TOML. Drop the flag if a generated
# project adds its own `_typos.toml`.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.47.1"
hooks = [
  { id = "typos", args = ["--isolated"] },
]

# GitHub Actions workflow validation
[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.37.2"
hooks = [
  { id = "check-github-workflows" },
]

# GitHub Actions linting
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" },
]

# Rust formatting — runs `cargo fmt --check` on a rendered project in the
# template checkout; stays a fixer in generated projects.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
entry = "scripts/rendered-check.sh fmt"
language = "system"
pass_filenames = false

# Rust clippy linting — needs a full build, so it only runs in generated
# projects; template-ci.yml covers it on renders.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "sh -c 'test -f cargo-generate.toml || exec cargo clippy --all-targets --all-features --manifest-path Cargo.toml'"
language = "system"
pass_filenames = false
env = { RUSTFLAGS = "-D warnings", RUSTDOCFLAGS = "-D warnings" }

# Rust documentation check — same as clippy: skipped in the template checkout.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc"
entry = "sh -c 'test -f cargo-generate.toml || exec cargo doc --no-deps --document-private-items --manifest-path Cargo.toml'"
language = "system"
pass_filenames = false

# Cargo deny check (dependencies) — runs on a rendered project in the
# template checkout, so shipped Cargo.lock advisories are caught pre-push.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
entry = "scripts/rendered-check.sh deny"
language = "system"
pass_filenames = false

# Cargo machete (unused dependencies)
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-machete"
name = "cargo machete"
entry = "scripts/rendered-check.sh machete"
language = "system"
pass_filenames = false
